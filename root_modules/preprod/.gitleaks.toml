title = "custom gitleaks config for terraform + tfvars"

[extend]
useDefault = true

# Covers .tf, .tfvars, .tfvars.json, and .hcl files (default rule only covers .tf/.hcl)
[[rules]]
id = "terraform-tfvars-password"
description = "Hardcoded password in Terraform var files (.tf, .tfvars, .hcl)"
regex = '''(?i)(admin_password|password|passwd|pwd)\s*=\s*"[^"]{6,}"'''
path = '''(?i)\.(?:tf|tfvars|hcl)$'''
tags = ["terraform", "password", "hardcoded"]

[[rules]]
id = "terraform-tfvars-secret"
description = "Hardcoded secret/key/token in Terraform var files (.tf, .tfvars, .hcl)"
regex = '''(?i)(secret|api_key|apikey|access_key|client_secret|token)\s*=\s*"[^"]{6,}"'''
path = '''(?i)\.(?:tf|tfvars|hcl)$'''
tags = ["terraform", "secret", "hardcoded"]

[allowlist]
description = "Ignore obvious placeholder values"
regexes = [
  '''(?i)"(changeme|xxxx+|placeholder|example|<.*>)"''',
]
